name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push or a new commit on a branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `nuxt typecheck` needs more than Node's default heap on this content set.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The suite drives system Chrome (`channel: 'chrome'`), the browser the
      # site is actually used in, rather than a downloaded Chromium build.
      - run: npx playwright install --with-deps chrome

      - run: npm run test:e2e

      - name: Keep traces from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
