<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!--
    The app mark, drawn to match the logo in the site header (AppHeader.vue):
    the brand chevrons on a rounded square tinted with brand at 15% and ringed
    with brand at 30%. Keep the two in step by hand - a static file in public/
    cannot share props with the component. The chevrons are set 50% of the
    square rather than the 37.5% the header badge uses, so the mark still reads
    at the 16px a browser tab draws it at.
  -->
  <rect width="32" height="32" rx="8" fill="#0b0d10" />
  <rect width="32" height="32" rx="8" fill="#29e2bd" fill-opacity="0.15" />
  <rect
    x="0.5"
    y="0.5"
    width="31"
    height="31"
    rx="7.5"
    fill="none"
    stroke="#29e2bd"
    stroke-opacity="0.3"
  />
  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#29e2bd"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M9 8l-5 4 5 4" />
    <path d="M15 8l5 4-5 4" />
  </g>
</svg>
